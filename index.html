    <!--
      No Google Fonts link here on purpose. It used to pull Inter and Cormorant
      Garamond, and it was the worst kind of asset: a render-blocking stylesheet on
      a third-party origin, so first paint waited on DNS + TLS to fonts.googleapis.com
      and then on a second hop to fonts.gstatic.com for the files themselves.
      Cormorant was dead weight — `.font-serif` has been Inter for a while (see
      custom-theme.css) and nothing else asked for a serif — and Inter is now
      self-hosted through unplugin-fonts/fontsource in vite.config.mjs, served from
      our own origin on a connection the browser has already opened.
    -->
  </head>
